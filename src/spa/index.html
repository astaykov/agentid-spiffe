<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Agent ID POC — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>

  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">

  <style>
    #chatMessages {
      min-height: 420px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 1rem;
      background: #f8f9fc;
      border: 1px solid #e3e6f0;
    }
    .chat-message {
      display: flex;
      margin-bottom: 1rem;
    }
    .chat-message.user {
      justify-content: flex-end;
    }
    .chat-bubble {
      max-width: 78%;
      padding: .75rem 1rem;
      border-radius: .35rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .chat-message.assistant .chat-bubble {
      background: #fff;
      border: 1px solid #d1d3e2;
      color: #3a3b45;
    }
    .chat-message.user .chat-bubble {
      background: #4e73df;
      color: #fff;
    }
    .chat-meta {
      display: block;
      margin-top: .45rem;
      font-size: .75rem;
      opacity: .72;
    }
    #msgInput {
      resize: none;
      min-height: 74px;
    }
    #status {
      min-height: 1.25rem;
    }
  </style>
</head>

<body id="page-top">
  <div id="wrapper">
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
      <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#">
        <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-user-shield"></i></div>
        <div class="sidebar-brand-text mx-3">Agent ID<sup>POC</sup></div>
      </a>
      <hr class="sidebar-divider my-0">
      <li class="nav-item active">
        <a class="nav-link" href="#"><i class="fas fa-comments"></i><span>Agent Chat</span></a>
      </li>
      <hr class="sidebar-divider">
      <div class="sidebar-heading">SPIFFE → Entra Agent ID</div>
    </ul>

    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <h1 class="h5 mb-0 text-gray-800">Entra Agent ID — SPIFFE FIC Demo</h1>
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <button id="loginBtn" class="btn btn-primary btn-sm">
                <i class="fas fa-sign-in-alt fa-sm"></i> Sign in
              </button>
            </li>
          </ul>
        </nav>

        <div class="container-fluid">
          <div class="row justify-content-center">
            <div class="col-lg-8">
              <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex align-items-center">
                  <h6 class="m-0 font-weight-bold text-primary">Agent Chat</h6>
                </div>
                <div class="card-body">
                  <div id="chatMessages" class="mb-3" role="log" aria-live="polite"></div>
                  <div class="input-group">
                    <textarea id="msgInput" class="form-control"
                              placeholder="Ask about Microsoft Entra ID..."
                              aria-label="Message" maxlength="4000" disabled></textarea>
                    <div class="input-group-append">
                      <button id="sendBtn" class="btn btn-success" type="button" disabled>
                        <i class="fas fa-paper-plane fa-sm"></i> Send
                      </button>
                    </div>
                  </div>
                  <div id="status" class="small text-gray-600 mt-2">Not signed in.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="sticky-footer bg-white">
        <div class="container my-auto">
          <div class="copyright text-center my-auto">
            <span>SPIFFE JWT-SVID → Entra Agent ID · POC</span>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/vendor/jquery/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/js/sb-admin-2.min.js"></script>

  <script src="env-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
