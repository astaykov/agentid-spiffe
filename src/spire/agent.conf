agent {
    data_dir = "/run/spire/data/agent"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "8081"
    trust_domain = "poc.local"
    socket_path = "/run/spire/sockets/agent.sock"

    # POC bootstrap: trust the co-located server without a pre-shared bundle.
    # Do NOT use in production — provide trust_bundle_path/url instead.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
