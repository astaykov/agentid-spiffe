server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "poc.local"
    data_dir = "/run/spire/data/server"
    log_level = "INFO"

    # JWT-SVID signing keys — required for the oidc-discovery-provider to
    # publish a JWKS and for agents to mint JWT-SVIDs.
    #
    # This is the `iss` claim in every JWT-SVID. Entra fetches
    # `<jwt_issuer>/.well-known/openid-configuration` (then its jwks_uri) to
    # validate the assertion, so it MUST be a public HTTPS URL you control and
    # must exactly match the FIC `issuer`. Templated at container start from
    # OIDC_ISSUER_URL (defaults to https://poc.local for local-only runs).
    jwt_issuer = "__OIDC_ISSUER_URL__"

    # Microsoft Entra workload identity federation ONLY accepts RS256-signed
    # assertions (see "Supported signing algorithms and issuers" in the Entra
    # Workload ID docs). SPIRE defaults to ec-p256 (ES256), which Entra rejects
    # at the FIC exchange with AADSTS501661. Force RSA so JWT-SVIDs are RS256.
    jwt_key_type = "rsa-2048"

    # Lifetime of minted JWT-SVIDs (the client assertion presented to Entra).
    # SPIRE defaults to 5 minutes; extend to 10 to give the token exchange more
    # headroom.
    default_jwt_svid_ttl = "10m"

    ca_subject {
        country = ["US"]
        organization = ["poc"]
        common_name = ""
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/server/datastore.sqlite3"
        }
    }

    # Join-token attestation keeps this POC simple — no cloud provider
    # attestor (AWS/Azure) needed to prove agent identity locally.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/server/keys.json"
        }
    }
}
