log_level = "INFO"
domains = __OIDC_DOMAINS__            # templated at container start (issuer host + localhost)
allow_insecure_scheme = true          # POC only — ACA/tunnel terminates TLS in front of this listener
insecure_addr = ":8443"               # plain HTTP listener (POC); TLS is terminated by ACA ingress

# Source the JWT bundle (JWKS) directly from the SPIRE server's local API.
server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}
